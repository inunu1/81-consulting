<section id="delivery" class="py-24 border-b border-gray-800 bg-[#0e1322]">
    <div class="max-w-7xl mx-auto px-6">
        <div class="mb-14">
            <h2 class="text-xs tracking-[0.3em] text-accent uppercase font-semibold mb-3" data-copy="delivery.eyebrow">Approach &amp; Delivery</h2>
            <h3 class="font-serif text-3xl font-bold" data-copy="delivery.heading">勝ち筋の設計から定着までの4ステップ</h3>
            <p class="text-gray-400 text-sm mt-3 max-w-2xl" data-copy="delivery.lead"></p>
        </div>

        <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6" data-repeat="delivery.steps">
            <template class="repeat-template">
                <div class="bg-darkBg p-6 border border-gray-800 flex flex-col justify-between">
                    <div>
                        <span class="text-xs text-accent font-semibold tracking-widest block mb-2" data-copy="step"></span>
                        <h4 class="font-bold text-base mb-2" data-copy="title"></h4>
                        <p class="text-sm text-gray-400 leading-relaxed mb-4" data-copy="summary"></p>
                    </div>
                    <p class="text-xs text-gray-500 border-t border-gray-800 pt-3 leading-relaxed" data-copy="detail"></p>
                </div>
            </template>
        </div>
    </div>
</section>
