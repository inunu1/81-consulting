<section id="contact" class="py-24 bg-darkBg">
    <div class="max-w-7xl mx-auto px-6">
        <div class="bg-[#0e1322] border border-gray-800 p-8 md:p-12 max-w-3xl">
            <h2 class="text-xs tracking-[0.3em] text-accent uppercase font-semibold mb-3" data-copy="contact.eyebrow">Contact</h2>
            <h3 class="font-serif text-3xl font-bold mb-4" data-copy="contact.heading">ご相談・お問い合わせ</h3>
            <p class="text-sm text-gray-400 leading-relaxed mb-8" data-copy="contact.lead"></p>
            <a href="#contact-form" data-copy-href="contact.ctaHref" class="inline-block bg-accent text-white px-8 py-4 font-medium hover:bg-purple-700 transition" data-copy="contact.ctaLabel">
                お問い合わせフォームへ
            </a>
            <p class="text-xs text-gray-500 mt-6" data-copy="contact.note"></p>
        </div>
    </div>
</section>
