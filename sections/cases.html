<section id="cases" class="py-24 border-b border-gray-800 bg-darkBg">
    <div class="max-w-7xl mx-auto px-6">
        <div class="mb-14">
            <h2 class="text-xs tracking-[0.3em] text-accent uppercase font-semibold mb-3" data-copy="cases.eyebrow">Case Studies</h2>
            <h3 class="font-serif text-3xl font-bold" data-copy="cases.heading">想定される支援ケース</h3>
            <p class="text-gray-400 text-sm mt-3 max-w-2xl" data-copy="cases.lead"></p>
        </div>

        <div class="grid md:grid-cols-3 gap-6" data-repeat="cases.items">
            <template class="repeat-template">
                <div class="bg-[#0e1322] p-6 border border-gray-800 flex flex-col justify-between">
                    <div>
                        <span class="text-xs text-accent font-semibold tracking-wider block mb-2" data-copy="tag"></span>
                        <h4 class="font-bold text-base mb-3" data-copy="title"></h4>
                        <p class="text-sm text-gray-400 leading-relaxed" data-copy="body"></p>
                    </div>
                </div>
            </template>
        </div>
    </div>
