<section id="members" class="py-24 border-b border-gray-800 bg-[#0e1322]">
    <div class="max-w-7xl mx-auto px-6">
        <div class="mb-14">
            <h2 class="text-xs tracking-[0.3em] text-accent uppercase font-semibold mb-3" data-copy="team.eyebrow">Team &amp; Advisors</h2>
            <h3 class="font-serif text-3xl font-bold" data-copy="team.heading">指導・分析を担うメンバー</h3>
            <p class="text-gray-400 text-sm mt-3 max-w-2xl" data-copy="team.lead"></p>
        </div>

        <div class="grid md:grid-cols-2 gap-6" data-repeat="team.members">
            <template class="repeat-template">
                <div class="bg-darkBg p-6 border border-gray-800">
                    <span class="text-xs text-accent font-semibold tracking-widest block mb-2" data-copy="role"></span>
                    <h4 class="font-bold text-lg mb-2" data-copy="name"></h4>
                    <p class="text-sm text-gray-400 leading-relaxed" data-copy="bio"></p>
                </div>
            </template>
        </div>
    </div>
</section>
